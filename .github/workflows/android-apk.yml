name: Android APK

on:
  push:
    branches: [claude/sweet-galileo-05z8sl, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync web app into Android project
        run: npx cap sync android

      # Reuse the same debug signing key across runs so a new APK installs as an
      # update over the previous one (keeping the data stored on the phone).
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WarehouseBlueprint.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarehouseBlueprint-apk
          path: WarehouseBlueprint.apk

      - name: Publish APK as a release download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest Android APK
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Debug build of Warehouse Blueprint from commit ${{ github.sha }} (run #${{ github.run_number }}).
            Download WarehouseBlueprint.apk on your Android phone and open it to install
            (allow "Install unknown apps" for your browser or file manager when asked).
          files: WarehouseBlueprint.apk
